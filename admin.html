
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        header {
            background: #1e293b;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .admin-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .login-box,
        .dashboard-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ddd;
        }

        .login-box {
            max-width: 400px;
            margin: 60px auto;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .logout-btn {
            background: #dc2626;
            margin-bottom: 15px;
        }

        .logout-btn:hover {
            background: #b91c1c;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 20px 0;
        }

        .stat-card {
            background: #e8f0ff;
            padding: 25px;
            border-radius: 8px;
        }

        .stat-card h2 {
            color: #2563eb;
            overflow-wrap: anywhere;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #2563eb;
            color: white;
        }

        .table-wrapper {
            overflow-x: auto;
            margin-bottom: 25px;
        }

        #best-selling {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
        }

        #best-selling li {
            padding: 8px 0;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            background: #1e293b;
            color: white;
        }

        @media (max-width: 768px) {
            .stats {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 600px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .admin-container {
                padding: 12px;
            }

            .login-box,
            .dashboard-box {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>ADMIN MANAGEMENT</h1>
        <nav>
            <a href="index.html">Trang chủ</a>
        </nav>
    </header>

    <main class="admin-container">

        <section id="admin-login" class="login-box">
            <h2>Đăng nhập Admin</h2>

            <form id="admin-login-form">
                <label for="admin-email">Email:</label>
                <input
                    type="email"
                    id="admin-email"
                    required
                    placeholder="Nhập email Admin"
                >

                <label for="admin-password">Mật khẩu:</label>
                <input
                    type="password"
                    id="admin-password"
                    required
                    placeholder="Nhập mật khẩu"
                >

                <button type="submit">Đăng nhập</button>

                <p
                    id="admin-message"
                    style="color: red;"
                    aria-live="polite"
                ></p>
            </form>
        </section>

        <section
            id="admin-dashboard"
            class="dashboard-box"
            style="display: none;"
        >
            <h2>Dashboard quản trị</h2>

            <div>
                <p>
                    Xin chào:
                    <strong id="admin-name"></strong>
                </p>

                <p>
                    Chức vụ:
                    <span id="admin-role"></span>
                </p>
            </div>

            <button
                type="button"
                id="admin-logout"
                class="logout-btn"
            >
                Đăng xuất
            </button>

            <div class="stats">

                <article class="stat-card">
                    <h3>Tổng đơn hàng</h3>
                    <h2 id="total-orders">0</h2>
                </article>

                <article class="stat-card">
                    <h3>Tổng doanh thu</h3>
                    <h2 id="total-revenue">0 VNĐ</h2>
                </article>

                <article class="stat-card">
                    <h3>Sản phẩm đã bán</h3>
                    <h2 id="total-products-sold">0</h2>
                </article>

            </div>

            <section>
                <h2>Danh sách đơn hàng</h2>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Mã đơn</th>
                                <th>Khách hàng</th>
                                <th>Ngày đặt</th>
                                <th>Tổng tiền</th>
                                <th>Trạng thái</th>
                            </tr>
                        </thead>

                        <tbody id="order-list"></tbody>
                    </table>
                </div>
            </section>

            <section>
                <h2>Sản phẩm bán chạy</h2>

                <div id="best-selling">
                    Chưa có dữ liệu sản phẩm bán chạy.
                </div>
            </section>

        </section>

    </main>

    <footer>
        <p>Võ Tường Vy - K244161825</p>
    </footer>

    <script src="js/admin.js"></script>

</body>
</html>
